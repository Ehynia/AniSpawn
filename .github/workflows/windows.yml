name: AniSpawn 0.5.15 Windows portable
on:
  workflow_dispatch:
  push:
    paths:
      - 'AniSpawn-0.5.15-Linux-Source.zip'
      - 'scripts/build-windows.ps1'
      - 'scripts/windows_prepare.py'
      - 'scripts/windows_entry.py'
      - '.github/workflows/windows.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source ZIP and build scripts
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare and validate standalone Windows portable package
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Upload tested portable Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AniSpawn-0.5.15-Windows-x64-portable
          path: dist/AniSpawn-0.5.15-Windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload smoke-test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AniSpawn-windows-smoke-failure
          path: ${{ runner.temp }}/anispawn-windows-selftest.json
          if-no-files-found: ignore
